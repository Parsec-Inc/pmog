[package]
name = "pmog"
version = "0.5.0"
edition = "2024"
description = "Jogo de terminal multiplayer na rede local"

[dependencies]
dirs = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.8"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = { version = "0.6.5", features = ["all"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

# scripts/package.sh deb: empacota o dist/pmog-linux (musl, já assinado) do scripts/build-dist.sh.
[package.metadata.deb]
maintainer = "Parsec-Inc <noreply@github.com>"
section = "games"
priority = "optional"
extended-description = "Jogo de terminal multiplayer na rede local. Traz o serviço pmog do firewalld e o perfil do ufw para liberar as portas, sem aplicar nada sozinho."
assets = [
    ["dist/pmog-linux", "usr/bin/pmog", "755"],
    ["dist/pmog-linux.sig", "usr/bin/pmog.sig", "644"],
    ["packaging/linux/pmog.xml", "usr/lib/firewalld/services/pmog.xml", "644"],
    ["packaging/linux/ufw-pmog", "etc/ufw/applications.d/pmog", "644"],
]
