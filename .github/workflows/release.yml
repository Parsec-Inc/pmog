name: Release


on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        required: true
        type: choice
        options: [PATCH, MINOR, MAJOR]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

jobs:
  tests:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.pull_request.merged
    uses: ./.github/workflows/tests.yml

  version:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
      pmog_release: ${{ steps.bump.outputs.pmog_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # PMOG_RELEASE (número do auto-update) sai daqui para todas as builds terem o mesmo.
      - name: Bump version
        id: bump
        env:
          INCREMENT: ${{ inputs.increment }}
        run: |
          set +e
          uvx --from commitizen cz bump --yes ${INCREMENT:+--increment "$INCREMENT"}
          status=$?
          set -e
          if [ "$status" -eq 21 ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          version="$(git describe --tags --exact-match HEAD)"
          uvx --from commitizen cz changelog "$version" --dry-run > release-notes.md
          git bundle create bump.bundle "$BASE_SHA..refs/tags/$version"
          {
            echo "released=true"
            echo "version=$version"
            echo "pmog_release=$(date -u +%Y%m%d%H%M)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.bump.outputs.released == 'true'
        with:
          name: bump
          path: bump.bundle

      - uses: actions/upload-artifact@v7
        if: steps.bump.outputs.released == 'true'
        with:
          name: notes
          path: release-notes.md

  linux:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PMOG_RELEASE: ${{ needs.version.outputs.pmog_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false

      - uses: ./.github/actions/release-checkout
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64 musl-tools rpm
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      # pmog-linux e pmog-windows.exe com .sig (o auto-update só aceita assinadas)
      - name: Build and sign
        env:
          PMOG_RELEASE_KEY: ${{ secrets.PMOG_RELEASE_KEY }}
        run: |
          ./scripts/with-release-key.sh ./scripts/build-dist.sh
          test -s dist/pmog-windows.exe.sig

      - name: Package
        run: ./scripts/package.sh deb rpm aur

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/pmog-*
            dist/*.deb
            !dist/*.src.rpm

      - uses: actions/upload-artifact@v7
        with:
          name: aur
          path: dist/aur/

      - uses: actions/upload-artifact@v7
        with:
          name: srpm
          path: dist/*.src.rpm

      # o assinador que o build-dist.sh compilou; o macos-sign usa sem recompilar o jogo
      - uses: actions/upload-artifact@v7
        with:
          name: signer
          path: target/release/examples/release

  macos:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PMOG_RELEASE: ${{ needs.version.outputs.pmog_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false

      - uses: ./.github/actions/release-checkout
        with:
          version: ${{ needs.version.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build universal
        run: ./scripts/package.sh macos

      - uses: actions/upload-artifact@v7
        with:
          name: macos-unsigned
          path: dist/pmog-macos

  # assina o binário do macOS no Linux (a chave não vai para o runner do Mac) e monta a fórmula
  macos-sign:
    needs: [version, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PMOG_RELEASE: ${{ needs.version.outputs.pmog_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false

      - uses: ./.github/actions/release-checkout
        with:
          version: ${{ needs.version.outputs.version }}

      - uses: actions/download-artifact@v8
        with:
          name: macos-unsigned
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: signer
          path: signer

      - name: Sign and package
        env:
          PMOG_RELEASE_KEY: ${{ secrets.PMOG_RELEASE_KEY }}
        run: |
          chmod +x signer/release
          ./scripts/with-release-key.sh signer/release sign macos "$PMOG_RELEASE" dist/pmog-macos
          ./scripts/package.sh brew

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/pmog-macos
            dist/pmog-macos.sig
            dist/*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: brew
          path: dist/brew/

  msi:
    needs: [version, linux]
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false

      - uses: ./.github/actions/release-checkout
        with:
          version: ${{ needs.version.outputs.version }}

      # o MSI empacota o mesmo .exe assinado da release, compilado no job linux
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist

      - name: WiX 3
        run: |
          [ -d "/c/Program Files (x86)/WiX Toolset v3.14/bin" ] || choco install wixtoolset --no-progress -y
          echo 'C:\Program Files (x86)\WiX Toolset v3.14\bin' >> "$GITHUB_PATH"

      - name: Package
        run: ./scripts/package.sh msi

      - uses: actions/upload-artifact@v7
        with:
          name: msi
          path: dist/*.msi

  release:
    needs: [version, tests, linux, macos-sign, msi]
    if: ${{ !cancelled() && needs.tests.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}

      - uses: ./.github/actions/release-checkout
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Push version commit and tag
        run: git push --atomic origin "$(git rev-parse "$VERSION^{commit}"):refs/heads/main" "refs/tags/$VERSION"

      - uses: actions/download-artifact@v8
        with:
          pattern: '{linux,macos,msi,notes}'
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: GitHub release
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv release-notes.md ..
          sha256sum -- * > SHA256SUMS
          gh release create "$VERSION" -R "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file ../release-notes.md -- *

  aur:
    needs: [version, release]
    if: ${{ vars.PUBLISH_AUR == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aur
          path: aur

      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: pmog-bin
          pkgbuild: ./aur/PKGBUILD
          updpkgsums: true
          commit_username: github-actions[bot]
          commit_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: ${{ needs.version.outputs.version }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  copr:
    needs: [version, release]
    if: ${{ vars.PUBLISH_COPR == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: srpm
          path: dist

      - uses: astral-sh/setup-uv@v10.3.2

      # COPR_CONFIG: conteúdo de ~/.config/copr (copr.fedorainfracloud.org/api)
      - name: Build no COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
        run: |
          mkdir -p ~/.config
          (umask 077 && printf '%s\n' "$COPR_CONFIG" > ~/.config/copr)
          uvx copr-cli build "$COPR_PROJECT" dist/*.src.rpm

  homebrew:
    needs: [version, release, macos-sign]
    if: ${{ vars.PUBLISH_BREW == 'true' && needs.macos-sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: brew
          path: brew

      # HOMEBREW_TAP_TOKEN: PAT com escrita em Parsec-Inc/homebrew-tap
      - name: Atualiza a fórmula no tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Parsec-Inc/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp brew/pmog.rb tap/Formula/pmog.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pmog.rb
          git diff --cached --quiet || { git commit -m "pmog $VERSION" && git push; }
