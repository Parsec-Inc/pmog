name: Tests

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Linux e Windows travam a release; o macOS roda à parte (macos.yml) para a fila do Mac não atrasar
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      # tape_animates_a_failed_mog é instável (falha às vezes sem relação com a mudança).
      - name: Test
        run: cargo test --locked --release -- --skip tape_animates_a_failed_mog
