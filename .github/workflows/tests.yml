name: Tests

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      # tape_animates_a_failed_mog é instável (falha às vezes sem relação com a mudança).
      - name: Test
        run: cargo test --locked --release -- --skip tape_animates_a_failed_mog
